name: kiro-gw

services:
  kiro-gw:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        KIRO_CLI_VERSION: "3.5.0"
    image: ${KIRO_GW_IMAGE:-kiro-acp-gateway:local}
    container_name: kiro-gw
    restart: unless-stopped
    ports:
      # 0.0.0.0 keeps the service working if the VM's DHCP address changes.
      # Restrict with a host firewall, or set KIRO_GW_BIND_IP=127.0.0.1 for local-only.
      - "${KIRO_GW_BIND_IP:-0.0.0.0}:8000:8000"
    env_file:
      - ${KIRO_GW_ENV_FILE:-./kiro-gw.env}
    volumes:
      - kiro-gw-home:/home/kiro/.kiro
      - ${KIRO_GW_WORKSPACE:-/home/vm-user/kiro-workspace}:/workspace:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    # Docker's json-file driver never rotates by default; cap the container log on disk
    # (5 x 10 MB). `docker compose logs` still works.
    logging:
      driver: json-file
      options:
        max-size: "${KIRO_GW_LOG_MAX_SIZE:-10m}"
        max-file: "${KIRO_GW_LOG_MAX_FILE:-5}"

volumes:
  kiro-gw-home:
    # Keep the existing named volume from the ad-hoc deployment.
    name: kiro-gw-home
